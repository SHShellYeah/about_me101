<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me - Md. Safwan Hossain Safi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f9fa;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.25rem;
    }

    .university {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #475569;
      margin-bottom: 0.75rem;
    }

    .skills-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }

    .skills-list li {
      font-size: 0.925rem;
      color: #334155;
      background-color: #f8fafc;
      border: 1px solid #edf2f7;
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
    }

    .link-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 0.925rem;
      font-weight: 500;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .link-btn:hover {
      background-color: #334155;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1 class="name">Md. Safwan Hossain Safi</h1>
    <p class="university">Daffodil International University (CSE)</p>

    <h2 class="section-title">Skills I'm Learning</h2>
    <ul class="skills-list">
      <li>Python &amp; Backend Development</li>
      <li>Machine Learning / AI</li>
      <li>Conversational Spanish</li>
    </ul>

    <a href="https://github.com/SHShellYeah" target="_blank" rel="noopener noreferrer" class="link-btn">
      GitHub
    </a>
  </main>

</body>
</html>
